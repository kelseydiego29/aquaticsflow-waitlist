@font-face { font-family: "Onest"; src: url("/assets/onest.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {

}
a { color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
header img { height: 30px; width: auto; display: block; }
.langs { display: flex; gap: 2px; font-size: 13px; font-weight: 700; }
.langs button { all: unset; cursor: pointer; padding: 10px 9px; color: var(--ink3); border-radius: 8px; }
.langs button[aria-pressed="true"] { color: var(--ink); }
.langs button:focus-visible, :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); }
.display { font-weight: 800; letter-spacing: -0.035em; line-height: 0.98; text-wrap: balance; }
.body { color: var(--ink2); text-wrap: pretty; }
.panel { background: var(--panel); border: 1px solid var(--panel-bd); border-radius: 28px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
footer { color: var(--ink3); font-size: 13px; padding-block: 40px 32px; display: flex; flex-wrap: wrap; gap: 8px 18px; }

.grid { display: grid; gap: 32px; padding-block: 28px 8px; grid-template-areas: "intro" "form" "perks"; }
/* On a phone the form comes right after the headline: people arrive from a video to sign up. */
@media (min-width: 960px) { .grid { grid-template-columns: 1fr 1.15fr; grid-template-areas: "intro form" "perks form"; column-gap: 64px; row-gap: 0; padding-top: 56px; align-items: start; } }
.a-intro { grid-area: intro; } .a-form { grid-area: form; } .a-perks { grid-area: perks; }
h1 { font-size: clamp(40px, 7vw, 60px); margin: 12px 0 0; max-width: 16ch; }
.intro { font-size: 17px; line-height: 1.6; margin-top: 20px; max-width: 50ch; }
.perks { list-style: none; padding: 0; margin: 4px 0 0; display: flex; flex-direction: column; gap: 20px; }
.perks li { display: flex; gap: 16px; }
.tick { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(127, 216, 255, 0.1); color: var(--cyan); }
.perks h2 { font-size: 17px; font-weight: 800; margin: 0; }
.perks p { font-size: 15px; line-height: 1.6; margin: 4px 0 0; }
form { display: grid; gap: 16px; padding: 24px; }
@media (min-width: 768px) { form { grid-template-columns: 1fr 1fr; padding: 28px; } .span2 { grid-column: span 2; } }
label.f { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.opt { font-weight: 400; color: var(--ink3); }
input[type=text], input[type=email], select {
  margin-top: 6px; width: 100%; border-radius: 12px; border: 1px solid var(--panel-bd); background: rgba(6, 26, 46, 0.6);
  padding: 12px 14px; font: inherit; font-size: 15px; color: #fff; outline: none; min-height: 48px;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%);
  background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
input:focus, select:focus { border-color: var(--brand-hi); }
.consent { display: flex; align-items: flex-start; gap: 12px; font-size: 14px; line-height: 1.4; color: var(--ink2); }
.consent input { margin-top: 2px; width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
.err { color: var(--err); font-size: 14px; font-weight: 600; margin: 0; }
button.go { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px;

button.go:hover { background: var(--brand-hi); }
button.go[disabled] { opacity: 0.7; cursor: progress; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; animation: s 0.8s linear infinite; display: none; }
button.go[disabled] .spin { display: inline-block; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.thanks h2 { font-size: 24px; font-weight: 800; margin: 0; }
.thanks p { font-size: 15.5px; line-height: 1.6; margin: 8px 0 0; }

ls sobre o lançamento e o meu convite. Posso pedir para sair a qualquer momento.","wl.consentError":"Marca a caixa para te podermos enviar o convite por email.","wl.genericError":"Algo correu mal. Tenta novamente daqui a pouco.","wl.thanksTitle":"Estás na lista","wl.thanksBody":"Obrigado. Enviámos uma confirmação para o teu email e voltamos a escrever no dia do lançamento com o teu convite.","wl.privacyNote":"Só usamos isto para te contactar sobre o AquaticsFlow e apagamos tudo 6 meses depois do lançamento.","wl.privacyLink":"Política de privacidade","nav.waitlist":"Entrar na lista de espera","legal.eyebrow":"Informação legal","legal.updated":"Última atualização: {date}","legal.contact":"Perguntas ou pedidos:","legal.privacyDesc":"Que dados a AquaticsFlow guarda sobre nadadores, famílias e treinadores, quem os pode ver e quais são os teus direitos."},"fr":{"wl.metaTitle":"Liste d'attente","wl.metaDesc":"AquaticsFlow ouvre bientôt aux clubs. Rejoignez la liste d'attente pour un accès prioritaire et un tarif fondateur.","wl.eyebrow":"Ouverture prochaine","wl.title":"Soyez parmi les premiers clubs sur AquaticsFlow","wl.body":"Nous ouvrons aux clubs dans quelques semaines. Rejoignez la liste : vous entrerez en premier, avec un tarif fondateur, et nous vous demanderons ce que vous aimeriez voir ensuite.","wl.perk1.title":"Les premiers le jour du lancement","wl.perk1.body":"Vous recevez votre invitation avant tout le monde, avec vos 30 jours d'essai gratuit prêts à démarrer.","wl.perk2.title":"Un tarif fondateur","wl.perk2.body":"Les clubs de la liste paient moins cher la première année. Nous vous enverrons les détails avec votre invitation.","wl.perk3.title":"Votre mot à dire sur la suite","wl.perk3.body":"Les clubs fondateurs nous disent ce dont ils ont besoin, et cela oriente ce que nous construisons.","wl.name":"Votre nom","wl.email":"E-mail","wl.role":"Vous êtes","wl.club":"Club","wl.country":"Pays","wl.band":"Nageurs actifs","wl.tool":"Qu'utilisez-vous aujourd'hui ?","wl.optional":"facultatif","wl.choose":"Choisir","wl.role.coach":"Entraîneur","wl.role.club_admin":"Administrateur du club","wl.role.parent":"Parent","wl.role.swimmer":"Nageur","wl.role.other":"Autre","wl.band.50":"Jusqu'à 50","wl.band.100":"Jusqu'à 100","wl.band.200":"Jusqu'à 200","wl.band.400":"Jusqu'à 400","wl.band.more":"Plus de 400","wl.tool.hytek":"Hy-Tek Team Manager","wl.tool.teamunify":"TeamUnify","wl.tool.swimtopia":"SwimTopia","wl.tool.spreadsheet":"Tableurs","wl.tool.paper":"Papier","wl.tool.other":"Autre","wl.consent":"J'accepte qu'AquaticsFlow m'écrive au sujet du lancement et de mon invitation. Je peux demander à être retiré de la liste à tout moment.","wl.consentError":"Cochez la case pour que nous puissions vous envoyer votre invitation.","wl.genericError":"Une erreur s'est produite. Réessayez dans un instant.","wl.thanksTitle":"Vous êtes sur la liste","wl.thanksBody":"Merci. Nous vous avons envoyé une confirmation par e-mail et nous vous écrirons le jour du lancement avec votre invitation.","wl.privacyNote":"Nous les utilisons uniquement pour vous contacter au sujet d'AquaticsFlow, et les supprimons 6 mois après le lancement.","wl.privacyLink":"Politique de confidentialité","nav.waitlist":"Rejoindre la liste d'attente","legal.eyebrow":"Informations légales","legal.updated":"Dernière mise à jour : {date}","legal.contact":"Questions ou demandes :","legal.privacyDesc":"Ce qu'AquaticsFlow conserve sur les nageurs, les familles et les entraîneurs, qui peut le voir, et vos droits."}};

const LANGS = ["en","pt","fr"];
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("af_lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const b = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(b)) return b;
  }
  return "en";
}
function wireLangs(apply) {
  let current = pickLang();
  const set = (l) => {
    current = l;
    document.documentElement.lang = l === "pt" ? "pt-PT" : l;
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    try { localStorage.setItem("af_lang", l); } catch (e) {}
    apply(l);
  };
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => set(b.dataset.lang)));
  set(current);
  return () => current;
}

const getLang = wireLangs((l) => {
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = (el.dataset.pre || "") + T[l][el.dataset.t]; });
  document.title = T[l]["wl.metaTitle"] + " · AquaticsFlow";
});

// ?src=ig (etc.) is stored with the sign-up so channels can be compared. Our own field, not a tracker.
const rawSrc = new URLSearchParams(location.search).get("src") || "";
const SRC = /^[a-z0-9_-]{1,32}$/i.test(rawSrc) ? rawSrc.toLowerCase() : null;
const ROLES = ["coach","club_admin","parent","swimmer","other"], BANDS = ["50","100","200","400","more"], TOOLS = ["hytek","teamunify","swimtopia","spreadsheet","paper","other"];

const form = document.getElementById("wl"), err = document.getElementById("wl-err"), btn = form.querySelector("button.go");
const show = (msg) => { err.textContent = msg; err.hidden = !msg; };
const done = () => { form.hidden = true; document.getElementById("wl-thanks").hidden = false; };

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const l = getLang(), d = new FormData(form), v = (k) => String(d.get(k) || "").trim();
  show("");
  if (v("website")) return done();                      // honeypot: a bot is told it worked, nothing is stored
  if (!form.reportValidity()) return;
  if (!d.get("consent")) return show(T[l]["wl.consentError"]);
  btn.disabled = true;
  try {
    const res = await fetch("https://mcggpfofzbdjhnygkday.supabase.co/rest/v1/rpc/join_waitlist", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: "sb_publishable_4gpPHf9CR0m2HKDXb5dX4w_Qyh34PKM", Authorization: "Bearer " + "sb_publishable_4gpPHf9CR0m2HKDXb5dX4w_Qyh34PKM" },
      body: JSON.stringify({
        p_email: v("email"), p_name: v("name"),
        p_role: ROLES.includes(v("role")) ? v("role") : "other",
        p_club_name: v("club") || null, p_country: v("country") || null,
        p_band: BANDS.includes(v("band")) ? v("band") : null,
        p_tool: TOOLS.includes(v("tool")) ? v("tool") : null,
        p_language: l, p_source: SRC, p_consent: true,
      }),
    });
    if (res.ok) return done();
    // The database's own refusals (a bad email, too many sign-ups at once) are sentences written for people.
    const body = await res.json().catch(() => ({}));
    show(body && (body.code === "22023" || body.code === "54000") && body.message ? body.message : T[l]["wl.genericError"]);
  } catch (e2) {
    show(T[getLang()]["wl.genericError"]);
  } finally {
    btn.disabled = false;
  }
});
