ls sobre o lançamento e o meu convite. Posso pedir para sair a qualquer momento.","wl.consentError":"Marca a caixa para te podermos enviar o convite por email.","wl.genericError":"Algo correu mal. Tenta novamente daqui a pouco.","wl.thanksTitle":"Estás na lista","wl.thanksBody":"Obrigado. Enviámos uma confirmação para o teu email e voltamos a escrever no dia do lançamento com o teu convite.","wl.privacyNote":"Só usamos isto para te contactar sobre o AquaticsFlow e apagamos tudo 6 meses depois do lançamento.","wl.privacyLink":"Política de privacidade","nav.waitlist":"Entrar na lista de espera","legal.eyebrow":"Informação legal","legal.updated":"Última atualização: {date}","legal.contact":"Perguntas ou pedidos:","legal.privacyDesc":"Que dados a AquaticsFlow guarda sobre nadadores, famílias e treinadores, quem os pode ver e quais são os teus direitos."},"fr":{"wl.metaTitle":"Liste d'attente","wl.metaDesc":"AquaticsFlow ouvre bientôt aux clubs. Rejoignez la liste d'attente pour un accès prioritaire et un tarif fondateur.","wl.eyebrow":"Ouverture prochaine","wl.title":"Soyez parmi les premiers clubs sur AquaticsFlow","wl.body":"Nous ouvrons aux clubs dans quelques semaines. Rejoignez la liste : vous entrerez en premier, avec un tarif fondateur, et nous vous demanderons ce que vous aimeriez voir ensuite.","wl.perk1.title":"Les premiers le jour du lancement","wl.perk1.body":"Vous recevez votre invitation avant tout le monde, avec vos 30 jours d'essai gratuit prêts à démarrer.","wl.perk2.title":"Un tarif fondateur","wl.perk2.body":"Les clubs de la liste paient moins cher la première année. Nous vous enverrons les détails avec votre invitation.","wl.perk3.title":"Votre mot à dire sur la suite","wl.perk3.body":"Les clubs fondateurs nous disent ce dont ils ont besoin, et cela oriente ce que nous construisons.","wl.name":"Votre nom","wl.email":"E-mail","wl.role":"Vous êtes","wl.club":"Club","wl.country":"Pays","wl.band":"Nageurs actifs","wl.tool":"Qu'utilisez-vous aujourd'hui ?","wl.optional":"facultatif","wl.choose":"Choisir","wl.role.coach":"Entraîneur","wl.role.club_admin":"Administrateur du club","wl.role.parent":"Parent","wl.role.swimmer":"Nageur","wl.role.other":"Autre","wl.band.50":"Jusqu'à 50","wl.band.100":"Jusqu'à 100","wl.band.200":"Jusqu'à 200","wl.band.400":"Jusqu'à 400","wl.band.more":"Plus de 400","wl.tool.hytek":"Hy-Tek Team Manager","wl.tool.teamunify":"TeamUnify","wl.tool.swimtopia":"SwimTopia","wl.tool.spreadsheet":"Tableurs","wl.tool.paper":"Papier","wl.tool.other":"Autre","wl.consent":"J'accepte qu'AquaticsFlow m'écrive au sujet du lancement et de mon invitation. Je peux demander à être retiré de la liste à tout moment.","wl.consentError":"Cochez la case pour que nous puissions vous envoyer votre invitation.","wl.genericError":"Une erreur s'est produite. Réessayez dans un instant.","wl.thanksTitle":"Vous êtes sur la liste","wl.thanksBody":"Merci. Nous vous avons envoyé une confirmation par e-mail et nous vous écrirons le jour du lancement avec votre invitation.","wl.privacyNote":"Nous les utilisons uniquement pour vous contacter au sujet d'AquaticsFlow, et les supprimons 6 mois après le lancement.","wl.privacyLink":"Politique de confidentialité","nav.waitlist":"Rejoindre la liste d'attente","legal.eyebrow":"Informations légales","legal.updated":"Dernière mise à jour : {date}","legal.contact":"Questions ou demandes :","legal.privacyDesc":"Ce qu'AquaticsFlow conserve sur les nageurs, les familles et les entraîneurs, qui peut le voir, et vos droits."}};
const DOCS = {"en":{"title":"Privacy policy","intro":"AquaticsFlow is a web app for swimming clubs, run by Xavier Digital Solutions (\"we\"). This policy explains what we hold, why, who we share it with, and your rights. For questions or requests, write to hello@aquaticsflow.com.","sections":[{"heading":"Who is responsible","paragraphs":["Xavier Digital Solutions is a company registered in Mozambique, at Rua Castelo Branco, n.º 190, Bairro da Malhangalene, 1100 Cidade de Maputo, Moçambique.","Your club decides what it records about its swimmers, families and coaches, and why. For that information the club is the controller, and we process it on the club's behalf and under its instructions.","We are the controller for your AquaticsFlow account itself (your sign-in email and password), for payments for AquaticsFlow plans and AquaticsFlow+, and for this website.","If you want to see, correct or remove what your club holds, you can ask your club, or write to hello@aquaticsflow.com and we will help."]},{"heading":"What we hold","paragraphs":[],"bullets":["Your account: your name, email address, a securely stored password (we never see it), your language, and your role in the club.","Swimmers: name, date of birth, sex and squad, and if the club adds them, a federation licence number and, for a swimmer who signs in, an email address.","Parents and guardians: name, and email and phone if the club adds them; which swimmers you are linked to; and any consent you gave, with the version of the club's text you agreed to.","Training and competition: sessions, attendance, check-ins (sleep, energy, mood, soreness, and whether a swimmer is ill or injured), times, personal bests, goals, meet entries, relay teams and dryland workouts.","Coaches: the expiry dates of safeguarding and first-aid certificates.","Club fees: what is owed, payments the club records, and receipts. Never card numbers.","Phone alerts: if you turn them on, an address from your phone's browser so we can deliver them.","Payments to AquaticsFlow: taken by Whop. We keep only whether a plan is active and Whop's reference for it. Your card details go to Whop, never to us.","The waitlist: if you join it on our website, your name, email, role, and if you add them your club, country, club size and the software you use now, plus which of our posts brought you. We use it only to tell you about the launch and send your invitation."]},{"heading":"Health information","paragraphs":["A check-in can say that a swimmer is ill or injured. That is health information. Only the swimmer, their linked parents and the club's coaches can see it, and it is used only to keep the swimmer safe in training."]},{"heading":"Children","paragraphs":["Most swimmers are children. A child only has an account if their club invites them. The club records a parent's consent before a child is made active, and a parent can give or withdraw consent in the app.","There are no private messages between people in AquaticsFlow: announcements go from coaches to a whole squad and its parents. Alerts on a phone's lock screen and emails never name a child or show a time. Swimmers under 18 are never emailed; their parents are."]},{"heading":"Who can see it","paragraphs":["Everyone sees only their own club. A coach sees the swimmers they coach; a club admin and the head coach see the whole club. A parent sees only their own children, and a swimmer only themselves. The database enforces this, not just the screens."]},{"heading":"Who we share it with","paragraphs":["We do not sell data or use it for advertising, and we use no analytics or advertising trackers. These providers help us run AquaticsFlow:"],"bullets":["Supabase: the database and sign-in, stored in the European Union (Paris, France).","Netlify: hosts the app and this website. Requests pass through its servers, including in the United States.","Resend: sends our emails, from the European Union (Ireland).","Whop: takes payments, in the United States.","Apple, Google and Mozilla: deliver phone alerts, as encrypted messages with no names in them."]},{"heading":"Transfers outside the European Union","paragraphs":["Where a provider handles data outside the European Union, we rely on the safeguards that provider offers for international transfers."]},{"heading":"How long we keep it","paragraphs":["For as long as your club uses AquaticsFlow. When a club leaves, or when you ask us to delete information, we delete or anonymise it, except records the club must keep by law, such as consent and payment records.","Waitlist details are deleted 6 months after launch, or sooner if you ask (email hello@aquaticsflow.com)."]},{"heading":"Your rights","paragraphs":["You can ask to see, correct, delete or move your information, or object to how it is used. You can download everything held about you from Settings, and a parent can download their child's. For anything else, write to hello@aquaticsflow.com. You can also complain to the data protection authority where you live."]},{"heading":"Cookies","paragraphs":["We use only the cookies needed to keep you signed in and to remember your language. Your browser also remembers small preferences on your device, such as light or dark mode. There are no tracking or advertising cookies."]},{"heading":"Security","paragraphs":["Every connection to AquaticsFlow is encrypted. Who can see what is decided by rules in the database itself, so a screen can never show something its viewer isn't allowed to see."]},{"heading":"Changes","paragraphs":["If we change this policy, we update the date at the top, and we tell clubs in the app about important changes."]}]},"pt":{"title":"Política de privacidade","intro":"A AquaticsFlow é uma aplicação web para clubes de natação, gerida pela Xavier Digital Solutions (\"nós\"). Esta política explica que dados guardamos, porquê, com quem os partilhamos e quais são os teus direitos. Para perguntas ou pedidos, escreve para hello@aquaticsflow.com.","sections":[{"heading":"Quem é responsável","paragraphs":["A Xavier Digital Solutions é uma empresa registada em Moçambique, com morada em Rua Castelo Branco, n.º 190, Bairro da Malhangalene, 1100 Cidade de Maputo, Moçambique.","O teu clube decide o que regista sobre os seus nadadores, famílias e treinadores, e porquê. Para essa informação, o clube é o responsável pelo tratamento, e nós tratamo-la em nome do clube e segundo as suas instruções.","Somos responsáveis pela tua conta AquaticsFlow em si (o email e a palavra-passe com que entras), pelos pagamentos dos planos AquaticsFlow e do AquaticsFlow+, e por este site.","Se quiseres ver, corrigir ou apagar o que o teu clube guarda, podes pedir ao clube, ou escrever para hello@aquaticsflow.com e nós ajudamos."]},{"heading":"Que dados guardamos","paragraphs":[],"bullets":["A tua conta: nome, email, uma palavra-passe guardada de forma segura (nunca a vemos), o teu idioma e o teu papel no clube.","Nadadores: nome, data de nascimento, sexo e equipa e, se o clube os acrescentar, o número de licença federativa e, para um nadador que entra na app, um email.","Pais e encarregados de educação: nome e, se o clube os acrescentar, email e telefone; os nadadores a que estás ligado; e o consentimento que deste, com a versão do texto do clube que aceitaste.","Treino e competição: treinos, presenças, check-ins (sono, energia, disposição, dores e se o nadador está doente ou lesionado), tempos, recordes pessoais, objetivos, inscrições em provas, equipas de estafetas e treino em seco.","Treinadores: as datas de validade dos certificados de proteção de menores e de primeiros socorros.","Mensalidades do clube: o que está em dívida, os pagamentos que o clube regista e os recibos. Nunca números de cartão.","Alertas no telemóvel: se os ativares, um endereço do navegador do teu telemóvel para os podermos entregar.","Pagamentos à AquaticsFlow: feitos através da Whop. Guardamos apenas se um plano está ativo e a referência da Whop. Os dados do teu cartão vão para a Whop, nunca para nós.","A lista de espera: se entrares nela no nosso site, o teu nome, email e função e, se os indicares, o teu clube, país, tamanho do clube e o programa que usas hoje, além de qual das nossas publicações te trouxe. Usamos isto apenas para te avisar do lançamento e enviar o teu convite."]},{"heading":"Informação de saúde","paragraphs":["Um check-in pode indicar que um nadador está doente ou lesionado. Isso é informação de saúde. Só o nadador, os pais ligados a ele e os treinadores do clube a podem ver, e é usada apenas para manter o nadador seguro no treino."]},{"heading":"Crianças","paragraphs":["A maioria dos nadadores são crianças. Uma criança só tem conta se o clube a convidar. O clube regista o consentimento de um dos pais antes de a criança ficar ativa, e os pais podem dar ou retirar o consentimento na app.","Não existem mensagens privadas entre pessoas na AquaticsFlow: os comunicados vão dos treinadores para uma equipa inteira e para os pais. Os alertas no ecrã bloqueado e os emails nunca dizem o nome de uma criança nem mostram um tempo. Os nadadores com menos de 18 anos nunca recebem emails; os pais recebem."]},{"heading":"Quem pode ver","paragraphs":["Cada pessoa vê apenas o seu clube. Um treinador vê os nadadores que treina; o administrador do clube e o treinador principal veem o clube inteiro. Os pais veem apenas os próprios filhos, e um nadador apenas a si próprio. É a base de dados que o garante, não apenas os ecrãs."]},{"heading":"Com quem partilhamos","paragraphs":["Não vendemos dados nem os usamos para publicidade, e não usamos ferramentas de análise nem de publicidade. Estes fornecedores ajudam-nos a fazer funcionar a AquaticsFlow:"],"bullets":["Supabase: a base de dados e o início de sessão, guardados na União Europeia (Paris, França).","Netlify: aloja a app e este site. Os pedidos passam pelos seus servidores, incluindo nos Estados Unidos.","Resend: envia os nossos emails, a partir da União Europeia (Irlanda).","Whop: recebe os pagamentos, nos Estados Unidos.","Apple, Google e Mozilla: entregam os alertas no telemóvel, como mensagens encriptadas sem nomes."]},{"heading":"Transferências para fora da União Europeia","paragraphs":["Quando um fornecedor trata dados fora da União Europeia, recorremos às garantias que esse fornecedor oferece para transferências internacionais."]},{"heading":"Durante quanto tempo guardamos","paragraphs":["Enquanto o teu clube usar a AquaticsFlow. Quando um clube sai, ou quando pedes para apagar informação, apagamo-la ou tornamo-la anónima, exceto registos que o clube tem de guardar por lei, como os consentimentos e os pagamentos.","Os dados da lista de espera são apagados 6 meses depois do lançamento, ou antes, se pedires (escreve para hello@aquaticsflow.com)."]},{"heading":"Os teus direitos","paragraphs":["Podes pedir para ver, corrigir, apagar ou transferir a tua informação, ou opor-te à forma como é usada. Podes descarregar tudo o que guardamos sobre ti nas Definições, e os pais podem descarregar os dados dos filhos. Para qualquer outro pedido, escreve para hello@aquaticsflow.com. Também podes apresentar queixa à autoridade de proteção de dados do teu país."]},{"heading":"Cookies","paragraphs":["Usamos apenas os cookies necessários para manter a sessão iniciada e lembrar o teu idioma. O teu navegador também guarda pequenas preferências no teu dispositivo, como o modo claro ou escuro. Não há cookies de rastreio nem de publicidade."]},{"heading":"Segurança","paragraphs":["Todas as ligações à AquaticsFlow são encriptadas. Quem pode ver o quê é decidido por regras na própria base de dados, por isso um ecrã nunca mostra algo que quem o vê não pode ver."]},{"heading":"Alterações","paragraphs":["Se alterarmos esta política, atualizamos a data no topo e avisamos os clubes na app sobre alterações importantes."]}]},"fr":{"title":"Politique de confidentialité","intro":"AquaticsFlow est une application web pour les clubs de natation, gérée par Xavier Digital Solutions (« nous »). Cette politique explique quelles données nous conservons, pourquoi, avec qui nous les partageons et quels sont vos droits. Pour toute question ou demande, écrivez à hello@aquaticsflow.com.","sections":[{"heading":"Qui est responsable","paragraphs":["Xavier Digital Solutions est une société immatriculée au Mozambique, dont l'adresse est : Rua Castelo Branco, n.º 190, Bairro da Malhangalene, 1100 Cidade de Maputo, Moçambique.","Votre club décide de ce qu'il enregistre sur ses nageurs, ses familles et ses entraîneurs, et pourquoi. Pour ces informations, le club est le responsable du traitement, et nous les traitons pour son compte et selon ses instructions.","Nous sommes responsables de votre compte AquaticsFlow lui-même (l'e-mail et le mot de passe avec lesquels vous vous connectez), des paiements des formules AquaticsFlow et d'AquaticsFlow+, et de ce site.","Pour consulter, corriger ou supprimer ce que votre club conserve, vous pouvez le lui demander, ou écrire à hello@aquaticsflow.com et nous vous aiderons."]},{"heading":"Ce que nous conservons","paragraphs":[],"bullets":["Votre compte : votre nom, votre adresse e-mail, un mot de passe conservé de façon sécurisée (nous ne le voyons jamais), votre langue et votre rôle dans le club.","Nageurs : nom, date de naissance, sexe et groupe, et si le club les ajoute, le numéro de licence et, pour un nageur qui se connecte, une adresse e-mail.","Parents et responsables légaux : nom, et e-mail et téléphone si le club les ajoute ; les nageurs auxquels vous êtes rattaché ; et le consentement que vous avez donné, avec la version du texte du club que vous avez acceptée.","Entraînement et compétition : séances, présences, points forme (sommeil, énergie, humeur, courbatures, et si un nageur est malade ou blessé), temps, records personnels, objectifs, engagements, équipes de relais et préparation physique.","Entraîneurs : les dates d'expiration des certificats de protection de l'enfance et de premiers secours.","Cotisations du club : ce qui est dû, les paiements enregistrés par le club et les reçus. Jamais de numéro de carte.","Alertes sur le téléphone : si vous les activez, une adresse fournie par le navigateur de votre téléphone pour pouvoir les livrer.","Paiements à AquaticsFlow : encaissés par Whop. Nous conservons seulement le fait qu'une formule est active et la référence de Whop. Vos données de carte vont chez Whop, jamais chez nous.","La liste d'attente : si vous la rejoignez sur notre site, votre nom, votre e-mail et votre rôle et, si vous les indiquez, votre club, votre pays, la taille du club et le logiciel que vous utilisez aujourd'hui, ainsi que la publication qui vous a amené. Nous les utilisons uniquement pour vous annoncer le lancement et vous envoyer votre invitation."]},{"heading":"Informations de santé","paragraphs":["Un point forme peut indiquer qu'un nageur est malade ou blessé. C'est une information de santé. Seuls le nageur, ses parents rattachés et les entraîneurs du club peuvent la voir, et elle sert uniquement à protéger le nageur à l'entraînement."]},{"heading":"Enfants","paragraphs":["La plupart des nageurs sont des enfants. Un enfant n'a un compte que si son club l'invite. Le club enregistre le consentement d'un parent avant qu'un enfant soit activé, et un parent peut donner ou retirer son consentement dans l'application.","Il n'existe aucun message privé entre personnes dans AquaticsFlow : les annonces vont des entraîneurs à tout un groupe et à ses parents. Les alertes sur l'écran verrouillé et les e-mails ne nomment jamais un enfant et n'indiquent jamais de temps. Les nageurs de moins de 18 ans ne reçoivent jamais d'e-mails ; leurs parents, si."]},{"heading":"Qui peut voir quoi","paragraphs":["Chacun ne voit que son propre club. Un entraîneur voit les nageurs qu'il entraîne ; l'administrateur du club et l'entraîneur principal voient tout le club. Un parent ne voit que ses propres enfants, et un nageur que lui-même. C'est la base de données qui l'impose, pas seulement les écrans."]},{"heading":"Avec qui nous partageons","paragraphs":["Nous ne vendons pas de données et ne les utilisons pas pour de la publicité, et nous n'utilisons aucun outil d'analyse ni traceur publicitaire. Ces prestataires nous aident à faire fonctionner AquaticsFlow :"],"bullets":["Supabase : la base de données et la connexion, stockées dans l'Union européenne (Paris, France).","Netlify : héberge l'application et ce site. Les requêtes passent par ses serveurs, y compris aux États-Unis.","Resend : envoie nos e-mails, depuis l'Union européenne (Irlande).","Whop : encaisse les paiements, aux États-Unis.","Apple, Google et Mozilla : livrent les alertes sur le téléphone, sous forme de messages chiffrés sans aucun nom."]},{"heading":"Transferts hors de l'Union européenne","paragraphs":["Lorsqu'un prestataire traite des données hors de l'Union européenne, nous nous appuyons sur les garanties que ce prestataire propose pour les transferts internationaux."]},{"heading":"Durée de conservation","paragraphs":["Aussi longtemps que votre club utilise AquaticsFlow. Lorsqu'un club part, ou lorsque vous nous demandez de supprimer des informations, nous les supprimons ou les anonymisons, sauf les documents que le club doit conserver légalement, comme les consentements et les paiements.","Les données de la liste d'attente sont supprimées 6 mois après le lancement, ou plus tôt si vous le demandez (écrivez à hello@aquaticsflow.com)."]},{"heading":"Vos droits","paragraphs":["Vous pouvez demander à consulter, corriger, supprimer ou transférer vos informations, ou vous opposer à leur utilisation. Vous pouvez télécharger tout ce que nous conservons sur vous depuis les Réglages, et un parent peut télécharger les données de son enfant. Pour toute autre demande, écrivez à hello@aquaticsflow.com. Vous pouvez aussi déposer une réclamation auprès de l'autorité de protection des données de votre pays."]},{"heading":"Cookies","paragraphs":["Nous utilisons uniquement les cookies nécessaires pour vous garder connecté et retenir votre langue. Votre navigateur retient aussi de petites préférences sur votre appareil, comme le mode clair ou sombre. Aucun cookie de suivi ni de publicité."]},{"heading":"Sécurité","paragraphs":["Toutes les connexions à AquaticsFlow sont chiffrées. Qui peut voir quoi est décidé par des règles dans la base de données elle-même : un écran ne peut donc jamais montrer ce que la personne qui le regarde n'a pas le droit de voir."]},{"heading":"Modifications","paragraphs":["Si nous modifions cette politique, nous mettons à jour la date en haut de page et informons les clubs dans l'application des changements importants."]}]}};
const UPDATED = "2026-10-01";

const LANGS = ["en","pt","fr"];
function pickLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (LANGS.includes(q)) return q;
  try { const s = localStorage.getItem("af_lang"); if (LANGS.includes(s)) return s; } catch (e) {}
  for (const l of navigator.languages || [navigator.language || "en"]) {
    const b = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(b)) return b;
  }
  return "en";
}
function wireLangs(apply) {
  let current = pickLang();
  const set = (l) => {
    current = l;
    document.documentElement.lang = l === "pt" ? "pt-PT" : l;
    document.querySelectorAll(".langs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    try { localStorage.setItem("af_lang", l); } catch (e) {}
    apply(l);
  };
  document.querySelectorAll(".langs button").forEach((b) => b.addEventListener("click", () => set(b.dataset.lang)));
  set(current);
  return () => current;
}

const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
wireLangs((l) => {
  const doc = DOCS[l], a = document.getElementById("doc");
  a.replaceChildren();
  a.append(el("div", T[l]["legal.eyebrow"], "eyebrow"), el("h1", doc.title, "display"),
    el("p", T[l]["legal.updated"].replace("{date}", new Date(UPDATED + "T12:00:00Z").toLocaleDateString(l === "pt" ? "pt-PT" : l === "en" ? "en-GB" : l, { day: "numeric", month: "long", year: "numeric" })), "updated"),
    el("p", doc.intro));
  for (const s of doc.sections) {
    a.append(el("h2", s.heading));
    for (const p of s.paragraphs) a.append(el("p", p));
    if (s.bullets && s.bullets.length) { const ul = el("ul"); for (const b of s.bullets) ul.append(el("li", b)); a.append(ul); }
  }
  document.querySelectorAll("[data-t]").forEach((x) => { x.textContent = T[l][x.dataset.t]; });
  document.title = doc.title + " · AquaticsFlow";
});
</script>
